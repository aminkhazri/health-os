<script>
// ---------- Muscles: name, anatomical name, group (for weekly sets) and what it does. ----------
const BD_MUSCLES = {

  traps_mid: { n: 'Mid back', lat: 'Middle trapezius & rhomboids', g: 'pull', does: 'Squeezes the shoulder blades together. Builds posture and balances all the pressing.' },
  traps_up:  { n: 'Upper traps', lat: 'Upper trapezius', g: 'pull', does: 'Shrugs the shoulders up and supports the neck. Trained by shrugs and carries.' },
  delt_p:    { n: 'Rear delts', lat: 'Posterior deltoid', g: 'pull', does: 'Pulls the arm back. Small but key for shoulder balance, trained by rows and pull-aparts.' },
  cuff:      { n: 'Rotator cuff', lat: 'Infraspinatus & teres', g: 'pull', does: 'Sits on the shoulder blade. Turns the arm outward and holds the shoulder joint steady in every press and row.' },
  biceps:    { n: 'Biceps', lat: 'Biceps brachii & brachialis', g: 'pull', does: 'Bends the elbow and turns the palm up. Helps in every row.' },
  forearms:  { n: 'Forearms', lat: 'Wrist flexors & extensors', g: 'pull', does: 'Grip and wrist control. Trained by carries, rows and anything you hold.' },
  neck:      { n: 'Neck', lat: 'Sternocleidomastoid & neck extensors', g: 'pull', does: 'Moves and steadies the head. A strong neck helps absorb contact and headers.' },
  quads:     { n: 'Quads', lat: 'Quadriceps femoris', g: 'legs', does: 'Straightens the knee. The front of the thigh, worked by squats and split squats.' },
  adductors: { n: 'Inner thigh', lat: 'Adductor group', g: 'legs', does: 'Pulls the leg in toward the midline and steadies the hip. Important for cutting and kicking.' },
  hams:      { n: 'Hamstrings', lat: 'Biceps femoris, semitendinosus, semimembranosus', g: 'legs', does: 'Bends the knee and drives the hip back. Key for sprinting; trained by RDLs.' },
  glute_max: { n: 'Glutes', lat: 'Gluteus maximus', g: 'legs', does: 'Extends the hip: standing up, sprinting, jumping. The largest muscle in the body.' },
  glute_med: { n: 'Side glutes', lat: 'Gluteus medius', g: 'legs', does: 'Holds the pelvis level on one leg. Protects the knee in running and single-leg work.' },
  calves:    { n: 'Calves', lat: 'Gastrocnemius & soleus', g: 'legs', does: 'Points the foot and pushes you off the ground. Every step, sprint and jump.' },
  tibialis:  { n: 'Shins', lat: 'Tibialis anterior', g: 'legs', does: 'Lifts the toes and foot. Strong shins help prevent shin splints.' },
  abs:       { n: 'Abs', lat: 'Rectus abdominis', g: 'core', does: 'Curls the trunk and stops the lower back from arching. Braces you under load.' },
  obliques:  { n: 'Obliques', lat: 'External & internal obliques', g: 'core', does: 'Twists and side-bends the trunk, and resists twisting. Trained by side planks and carries.' },
  erectors:  { n: 'Lower back', lat: 'Erector spinae', g: 'core', does: 'Holds the spine straight. Works in deadlifts, RDLs and every carry.' },
};
const BD_GROUPS = { push: ['Push muscles', 12], pull: ['Pull muscles', 12], legs: ['Leg muscles', 15], core: ['Core', 8] };   // name, weekly set target
const BD_COLORS = { push: '#b8f23e', pull: '#2dd4bf', legs: '#f2546b', core: '#a78bfa' };
// What each exercise works. p = main muscles, s = helpers (count half). kind: w = weighted (score from estimated 1-rep max vs bodyweight),
// r = reps, h = hold seconds. ref = the result that scores 60 ("solid intermediate"). Rough guides, not lab numbers.
const BD_EX = {
  'Goblet squat': { p: ['quads', 'glute_max'], s: ['adductors', 'abs', 'erectors'], k: 'w', ref: .45 },
  'Dumbbell floor press': { p: ['pecs'], s: ['triceps', 'delt_a'], k: 'w', ref: .35 },
  'One-arm dumbbell row': { p: ['lats', 'traps_mid'], s: ['biceps', 'delt_p', 'cuff', 'forearms'], k: 'w', ref: .45 },
  'Dumbbell Romanian deadlift': { p: ['hams', 'glute_max'], s: ['erectors', 'forearms', 'adductors'], k: 'w', ref: .4 },
  'Dumbbell shoulder press': { p: ['delt_a'], s: ['delt_l', 'triceps', 'traps_up', 'serratus'], k: 'w', ref: .25 },
  'Band pull-apart': { p: ['delt_p', 'traps_mid'], s: ['cuff'], k: 'r', ref: 20 },
  'Copenhagen plank': { p: ['adductors', 'obliques'], s: ['abs'], k: 'h', ref: 30 },
  'Side plank': { p: ['obliques'], s: ['glute_med', 'abs'], k: 'h', ref: 60 },
  'Bulgarian split squat': { p: ['quads', 'glute_max'], s: ['glute_med', 'adductors', 'hams'], k: 'w', ref: .3 },
  'Single-leg Romanian deadlift': { p: ['hams', 'glute_max'], s: ['glute_med', 'erectors'], k: 'w', ref: .3 },
  'Dumbbell hip thrust': { p: ['glute_max'], s: ['hams', 'glute_med'], k: 'w', ref: .6 },
  'Heel-raised goblet squat': { p: ['quads'], s: ['glute_max', 'abs'], k: 'w', ref: .35 },
  'Standing calf raise': { p: ['calves'], s: [], k: 'w', ref: .3 },
  'Dead bug': { p: ['abs'], s: ['obliques'], k: 'r', ref: 12 },
  'Split squat bottom hold': { p: ['quads'], s: ['glute_max', 'adductors'], k: 'h', ref: 45 },
  'Single-leg glute bridge hold': { p: ['glute_max'], s: ['hams', 'glute_med'], k: 'h', ref: 45 },
  'Push-up': { p: ['pecs'], s: ['triceps', 'delt_a', 'serratus', 'abs'], k: 'r', ref: 25 },
  'Band row': { p: ['lats', 'traps_mid'], s: ['biceps', 'delt_p', 'cuff'], k: 'r', ref: 15 },
  'Incline dumbbell press': { p: ['pecs', 'delt_a'], s: ['triceps', 'serratus'], k: 'w', ref: .3 },
  'Dumbbell lateral raise': { p: ['delt_l'], s: ['traps_up'], k: 'w', ref: .1 },
  'Dumbbell curl': { p: ['biceps'], s: ['forearms'], k: 'w', ref: .18 },
  'Overhead triceps extension': { p: ['triceps'], s: [], k: 'w', ref: .25 },
  'Push-up bottom hold': { p: ['pecs'], s: ['triceps', 'serratus'], k: 'h', ref: 30 },
  "Dumbbell farmer's hold": { p: ['forearms', 'traps_up'], s: ['obliques', 'abs'], k: 'h', ref: 60 },
  'Supine chin tuck': { p: ['neck'], s: [], k: 'r', ref: 15 },
  'Neck isometric hold': { p: ['neck'], s: [], k: 'h', ref: 10 },
  'Prone neck extension': { p: ['neck'], s: ['traps_up'], k: 'r', ref: 15 },
  'Side-lying neck raise': { p: ['neck'], s: [], k: 'r', ref: 15 },
  'Dumbbell shrug': { p: ['traps_up'], s: ['forearms', 'neck'], k: 'w', ref: .45 },
  'Single-leg deficit calf raise': { p: ['calves'], s: [], k: 'r', ref: 15 },
  'Seated dumbbell calf raise': { p: ['calves'], s: [], k: 'w', ref: .3 },
  'Tibialis raise': { p: ['tibialis'], s: [], k: 'r', ref: 20 },
  'Single-leg calf raise hold': { p: ['calves'], s: [], k: 'h', ref: 30 },
};

function bdBest(reps) { const n = String(reps || '').split(/[^0-9.]+/).map(Number).filter(x => x > 0); return n.length ? Math.max(...n) : 0; }
function bdBodyweight() { const w = (D.series || []).filter(x => x.w).slice(-1)[0]; return (w && w.w) || D.targets.start || 150; }
function bdMonday(k) { const [y, m, d] = k.split('-').map(Number), t = new Date(y, m - 1, d); return addDays(k, -((t.getDay() + 6) % 7)); }
function bdScore(ex, sets, reps, w, bw) {
  const m = BD_EX[ex]; if (!m) return null;
  const r = bdBest(reps); if (!r) return null;
  let v;
  if (m.k === 'w') { if (!w) return null; v = (w * (1 + r / 30) / bw) / m.ref; }   // Epley estimate of a 1-rep max, as a share of bodyweight
  else v = r / m.ref;
  return Math.max(1, Math.min(99, Math.round(60 * v)));
}

/** Everything the tab shows, worked out from the log. */
function bdModel() {
  const log = D.wlog || [], bw = bdBodyweight(), now = Date.now(), wk = bdMonday(D.today), keys = Object.keys(BD_MUSCLES);
  const fat = {}, last = {}, weekSets = {}, groupSets = { push: 0, pull: 0, legs: 0, core: 0 }, byWeek = {};
  keys.forEach(k => { fat[k] = 0; weekSets[k] = 0; });
  log.forEach(([d, , ex, sets, reps, w]) => {
    const m = BD_EX[ex]; if (!m) return;
    const n = sets || (bdBest(reps) ? 1 : 0), [y, mo, da] = d.split('-').map(Number);
    const hrs = (now - new Date(y, mo - 1, da, 12).getTime()) / 3600000;
    const decay = Math.exp(-Math.max(0, hrs) / 30);   // fatigue fades with a ~30 h time constant: most of it is gone after 2-3 days
    m.p.forEach(k => { fat[k] += n * decay; if (!last[k] || d > last[k]) last[k] = d; });
    m.s.forEach(k => { fat[k] += n * .5 * decay; if (!last[k] || d > last[k]) last[k] = d; });
    if (d >= wk) { m.p.forEach(k => { weekSets[k] += n; }); m.s.forEach(k => { weekSets[k] += n * .5; }); groupSets[BD_MUSCLES[m.p[0]].g] += n; }

      const [rear, out] = BD_FACE[k] || [0, 0], sgn = sp.M ? 0 : s === sp.L ? -1 : 1, dir = rear ? Math.PI - sgn * out : sgn * out, want = -dir;
      bd3Go(want + Math.round((BD3.yaw - want) / (2 * Math.PI)) * 2 * Math.PI, 1, 850); };
    BD3.ready = true; BD3.loading = false;
    BD3.yaw = -2.4; bd3Attach(BD3.M); bd3Go(0, 0, 1400);
  } catch (e) { BD3.failed = true; BD3.loading = false; console.warn('3D body unavailable, keeping the drawing: ' + (e && e.message || e)); }
}
/** Put the 3D canvas into the stage (the tab's HTML is rebuilt on every refresh) and repaint it. */
function bd3Attach(M) {
  BD3.M = M; if (!BD3.ready) { bd3Init(); return; }
  const st = $('bdStage'); if (!st || !M) return;
  if (BD3.canvas.parentElement !== st) st.insertBefore(BD3.canvas, $('bdFlip'));
  $('bdFlip').style.display = 'none';
  BD3.size(); BD3.xray(bdMode === 'bones'); BD3.paint(M);
}
/** Glide the body to a turn angle and a zoom level (0 = whole body, 1 = on the chosen muscle). */
function bd3Go(yaw, zoom, ms) {
  BD3.zoomTo = zoom; cancelAnimationFrame(BD3.raf);
  if (typeof RM !== 'undefined' && RM) { BD3.yaw = yaw; BD3.zoom = zoom; return BD3.draw(); }
  const y0 = BD3.yaw, z0 = BD3.zoom, t0 = performance.now(), dur = ms || 700;
  const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); BD3.yaw = y0 + (yaw - y0) * e; BD3.zoom = z0 + (zoom - z0) * e; BD3.draw(); if (p < 1) BD3.raf = requestAnimationFrame(step); };
  BD3.raf = requestAnimationFrame(step);
}
window.addEventListener('resize', () => { if (BD3.ready && $('bdStage')) { BD3.size(); BD3.draw(); } });

/** Choose a muscle: light it up, slide its sheet up over the bottom of the screen and zoom the body onto it. */
function bdSelect(k, side) {
  if (!BD3.M) return; bdSel = k; bdSide = side || bdSide;
  document.querySelectorAll('#bodyApp .bd-m').forEach(x => x.classList.toggle('sel', x.dataset.m === k));
  bdDetail(k, BD3.M); bdSheetOpen(true);
  if (BD3.ready) { BD3.paint(BD3.M); BD3.aim(k, bdSide); }
  if (navigator.vibrate) navigator.vibrate(6);
}
function bdClose() { bdSel = null; const sh = $('bdSheet'); if (sh) sh.classList.remove('open'); document.querySelectorAll('#bodyApp .bd-m.sel').forEach(x => x.classList.remove('sel'));
  if (BD3.ready && BD3.M) { BD3.paint(BD3.M); bd3Go(BD3.yaw, 0, 600); } }
/** Show the sheet just above the tab bar, bring the body to the top of the screen, and work out how much of the body is still in view above the sheet. */
function bdSheetOpen(scroll) {
  const sh = $('bdSheet'), st = $('bdStage'), nav = document.querySelector('nav'); if (!sh || !st) return;
  sh.style.bottom = (nav ? nav.offsetHeight : 62) + 'px'; sh.classList.add('open'); sh.scrollTop = 0;
  const top = 8, h = st.clientHeight, free = Math.max(140, Math.min(h, window.innerHeight - (nav ? nav.offsetHeight : 62) - sh.offsetHeight - top));
  BD3.lift = h / 2 - free / 2; BD3.fit = free / h;
  if (scroll) window.scrollTo({ top: st.getBoundingClientRect().top + window.scrollY - top, behavior: (typeof RM !== 'undefined' && RM) ? 'auto' : 'smooth' });
}

/** The detail panel for one muscle: what it does, recovery, this week's sets, strength, and your exercises for it. */
function bdDetail(k, M) {
  const m = BD_MUSCLES[k], f = M.fresh[k], st = bdState(f), days = bdDaysToFresh(f);
  const col = { fresh: '#c9564b', rec: '#ff8a2a', hot: '#ffdf5e' }[st];
  const lib = Object.keys(BD_EX).filter(ex => BD_EX[ex].p.includes(k)), helps = Object.keys(BD_EX).filter(ex => BD_EX[ex].s.includes(k));
  const sess = ex => { const L = Object.keys(D.workouts || {}).find(l => D.workouts[l].includes(ex)); if (L) return 'Workout ' + L; const P = Object.values(D.projects || {}).find(p => p.ex.includes(ex)); return P ? P.name : ''; };
  const exRow = (ex, i) => `<div><span>${esc(ex)}<small>${sess(ex)}</small></span>${(D.videos || {})[ex] ? `<button onclick="bdDemo(${i})">▶ Demo</button>` : ''}</div>`;
  bdDemoList = lib;
  $('bdSheet').innerHTML = `<div class="grip"></div><div class="hd"><div><h4>${m.n}</h4><div class="lat">${m.lat}</div></div><button class="x" onclick="bdClose()" aria-label="Close">✕</button></div>
    <div class="bd-rec"><i style="width:${f}%;background:${col}"></i></div>
    <div style="font-size:13px">${{ fresh: 'Recovered and ready to train', rec: 'Recovering', hot: 'Worked hard: let it rest' }[st]} · ${f}%${days ? ` · about ${days} day${days > 1 ? 's' : ''} to fresh` : ''}</div>
    <div class="bd-kv"><div><b>${Math.round(M.weekSets[k] * 10) / 10}</b><span>Sets this week</span></div><div><b>${M.score[k] ?? '—'}</b><span>Strength</span></div><div><b>${M.last[k] ? fmtDate(M.last[k], { month: 'short', day: 'numeric' }) : '—'}</b><span>Last trained</span></div></div>
    <div class="does">${m.does}</div>
    <div class="cap">Your exercises for it</div>
    <div class="bd-exl">${lib.length ? lib.map(exRow).join('') : '<div><span class="muted">None in your plan yet</span></div>'}</div>
    ${helps.length ? `<div style="font-size:13px;margin-top:8px;color:var(--text-muted)">Also helps in: ${helps.map(esc).join(', ')}</div>` : ''}`;
}
let bdDemoList = [];
function bdDemo(i) { const ex = bdDemoList[i]; if (ex) demo(ex); }

function renderBody() {
  if (!D || !$('bodyApp')) return;
  const M = bdModel(), first = !$('bodyApp').dataset.ready, keys = Object.keys(BD_MUSCLES);
  const freshCount = keys.filter(k => M.fresh[k] >= 85).length;
  const since = M.lastAny ? Math.max(0, Math.round((new Date(D.today) - new Date(M.lastAny)) / 86400000)) : null;
  const totSets = Object.values(M.groupSets).reduce((a, b) => a + b, 0), totTarget = Object.values(BD_GROUPS).reduce((a, g) => a + g[1], 0);
  const pct = Math.min(100, Math.round(totSets / totTarget * 100));
  const R = 84, C = 2 * Math.PI * R, gk = Object.keys(BD_GROUPS), quarter = C / gk.length, gap = 10;
  const arcs = gk.map((g, i) => { const done = Math.min(1, M.groupSets[g] / BD_GROUPS[g][1]), len = Math.max(0, (quarter - gap) * done);
    return `<circle class="bd-ring-bg" cx="100" cy="100" r="${R}" style="stroke-dasharray:${quarter - gap} ${C};stroke-dashoffset:${-i * quarter}"/>`
      + (len > 0 ? `<circle class="bd-ring-fg" data-len="${len}" cx="100" cy="100" r="${R}" stroke="${BD_COLORS[g]}" style="stroke-dasharray:0 ${C};stroke-dashoffset:${-i * quarter}"/>` : ''); }).join('');   // no arc when empty: a round cap would draw a dot
  const mini = (g) => { const r = 13, c = 2 * Math.PI * r, d = Math.min(1, M.groupSets[g] / BD_GROUPS[g][1]);
    return `<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="5"/>${d > 0 ? `<circle cx="17" cy="17" r="${r}" fill="none" stroke="${BD_COLORS[g]}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c * d} ${c}"/>` : ''}</svg>`; };
  const rows = gk.map(g => { const ms = keys.filter(k => BD_MUSCLES[k].g === g), left = Math.max(0, BD_GROUPS[g][1] - M.groupSets[g]);
    return `<div class="bd-row" onclick="this.nextElementSibling.classList.toggle('open')">${mini(g)}<div class="t"><b>${BD_GROUPS[g][0]}</b><span>${M.groupSets[g]} / ${BD_GROUPS[g][1]} sets</span></div>
      <div class="go"><b>${left || '✓'}</b><span>${left ? 'to go' : 'done'}</span></div></div>
      <div class="bd-sub">${ms.map(k => `<div><span>${BD_MUSCLES[k].n}</span><span>${Math.round(M.weekSets[k] * 10) / 10} sets</span></div>`).join('')}</div>`; }).join('');
  const spark = pts => { const v = pts.map((x, i) => [i, x]).filter(p => p[1] != null); if (!v.length) return '<div class="muted" style="flex:1;font-size:13px">Log weights and reps to score</div>';
    const lo = Math.min(...v.map(p => p[1])) - 4, hi = Math.max(...v.map(p => p[1])) + 4, X = i => 6 + i * (148 / 7), Y = y => 40 - (y - lo) / Math.max(1, hi - lo) * 32;
    const avg = v.reduce((a, p) => a + p[1], 0) / v.length;
    return `<svg class="bd-spark bd-draw" viewBox="0 0 160 44" preserveAspectRatio="none"><line x1="0" x2="160" y1="${Y(avg)}" y2="${Y(avg)}"/><polyline points="${v.map(p => X(p[0]) + ',' + Y(p[1])).join(' ')}"/>${v.map(p => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3"/>`).join('')}</svg>`; };
  const meterOn = M.overall == null ? 0 : Math.round(M.overall / 10);
  const groups = gk.map(g => { const ms = keys.filter(k => BD_MUSCLES[k].g === g), tr = bdTrend(M.gLine[g]);
    return `<div class="bd-grp ${bdOpenGrp[g] ? 'open' : ''}"><div class="bd-gh" onclick="bdOpenGrp['${g}']=!bdOpenGrp['${g}'];this.parentElement.classList.toggle('open')">
      <div class="t"><b>${BD_GROUPS[g][0]}</b>${M.gScore[g] != null ? `<span class="bd-chip ${tr}">${BD_ARROW[tr]}</span>` : ''}<div><span class="bd-cu" data-to="${M.gScore[g] ?? ''}">${M.gScore[g] ?? '—'}</span><small>STRENGTH</small></div></div><span class="bd-chev">⌄</span></div>
      <div class="bd-ms">${ms.map(k => `<div class="bd-mrow"><div class="t"><span>${BD_MUSCLES[k].n}</span><b>${M.score[k] ?? '—'}</b></div>${spark(M.line[k])}</div>`).join('')}</div></div>`; }).join('');
  const picks = bdPick(M), top = picks[0];
  const pickWhy = top ? `Its muscles are ${top.fresh}% recovered${top.need ? ` and ${top.need}% of their weekly sets are still to do` : ''}.${top.tired.length ? ' Still tired: ' + top.tired.join(', ') + '.' : ''}` : '';

  $('bodyApp').innerHTML = `
    ${top ? `<div class="card"><h2>Train next</h2>
      <div class="bd-pick"><div class="big">${top.L}</div><div class="t"><b>Workout ${top.L} · ${esc(top.name)}</b><div>${pickWhy}</div></div></div>
      <div class="bd-alts">${picks.map(p => `<div><b>${p.L}</b>${p.fresh}% fresh</div>`).join('')}</div>
      <button class="primary" style="margin-top:12px" onclick="letter='${top.L}';show('work');renderWorkout()">Open Workout ${top.L}</button></div>` : ''}
    <div class="card">
      <h2>Muscle map</h2>
      <div class="bd-stats"><div class="bd-stat"><b class="bd-cu" data-to="${since ?? ''}">${since ?? '—'}</b><span>${since === 1 ? 'Day' : 'Days'} since<br>last workout</span></div>
        <div class="bd-stat"><b class="bd-cu" data-to="${freshCount}">${freshCount}</b><span>Fresh muscles<br>of ${keys.length}</span></div></div>
      <div class="bd-modes"><button data-m="rec" class="${bdMode === 'rec' ? 'on' : ''}" onclick="bdModeSet('rec')">Recovery</button><button data-m="bones" class="${bdMode === 'bones' ? 'on' : ''}" onclick="bdModeSet('bones')">Show bones</button></div>
      <div class="bd-stage" id="bdStage"><div class="bd-floor"></div><div class="bd-flip ${bdMode === 'bones' ? 'bd-bones' : ''}" id="bdFlip"><div class="bd-face f">${bdFigure('front')}</div><div class="bd-face b">${bdFigure('back')}</div></div>
        <button class="bd-turn" onclick="bdTurn()" aria-label="Turn the figure around">⟲</button><div class="bd-side" id="bdSide">Front</div></div>
      <div class="bd-legend"><span><i style="background:#b4433a"></i>Fresh</span><span><i style="background:#ff8a2a"></i>Recovering</span><span><i style="background:#ffdf5e"></i>Worked</span></div>
      <div class="bd-info" id="bdInfo">Tap a muscle to zoom in and see its recovery, sets and strength. Drag sideways to spin the body.</div>
      <div class="bd-sheet" id="bdSheet" role="dialog" aria-label="Muscle details"></div>
    </div>
    <div class="card"><h2>This week's sets</h2>
      <div class="bd-ringwrap"><svg viewBox="0 0 200 200">${arcs}</svg><div class="bd-ring-mid"><b><span class="bd-cu" data-to="${pct}">${pct}</span>%</b><span>${totSets} of ${totTarget} sets</span></div></div>
      <div class="muted" style="text-align:center;margin-bottom:6px">${fmtDate(bdMonday(D.today), { month: 'short', day: 'numeric' })} – ${fmtDate(addDays(bdMonday(D.today), 6), { month: 'short', day: 'numeric' })} · tap a group for each muscle</div>
      ${rows}</div>
    <div class="card"><h2>Strength</h2>
      <div class="bd-top"><div class="bd-big bd-cu" data-to="${M.overall ?? ''}">${M.overall ?? '—'}</div><div class="bd-meter" id="bdMeter">${Array.from({ length: 10 }, () => '<i></i>').join('')}</div></div>
      <div class="muted" style="margin-top:6px">Overall strength, 0–100 · 60 is a solid intermediate for your bodyweight (${Math.round(M.bw)} lb)</div>
      ${groups}
      <p class="bd-note">Scores come from your best set of each exercise: weight and reps turn into an estimated one-rep max, compared with your bodyweight. Bodyweight moves use reps, holds use seconds. Recovery is an estimate: each set adds fatigue to the muscles it works (helpers count half), and it fades over about two to three days. Both are guides for your own progress, not medical or lab measures.<br>Anatomy model: BodyParts3D, © The Database Center for Life Science, CC BY 4.0, simplified and regrouped. The lats and abs are approximated from the body surface, and the head, hands and feet are plain smoothed shapes.</p></div>`;
  $('bodyApp').dataset.ready = 1;
  bdSetAngle(bdAngle);

  document.querySelectorAll('#bodyApp .bd-m').forEach((el, i) => {
    const k = el.dataset.m;
    el.classList.add(bdState(M.fresh[k])); if (bdSel === k) el.classList.add('sel');
    if (first && !(typeof RM !== 'undefined' && RM)) { el.style.opacity = 0; setTimeout(() => { el.style.opacity = ''; }, 120 + (i % 30) * 22); }
    el.addEventListener('click', () => { if (bdDragged) return; bdSelect(k); });
  });
  bd3Attach(M);
  if (bdSel) { bdDetail(bdSel, M); const sh = $('bdSheet'); sh.style.transition = 'none'; bdSheetOpen(false); void sh.offsetWidth; sh.style.transition = ''; if (BD3.ready) BD3.draw(); }   // a refresh keeps the open sheet in place
  // drag to rotate: the body follows your finger, then settles facing front or back
  const stage = $('bdStage'); let x0 = null, a0 = 0; bdDragged = false;
  stage.onpointerdown = e => { if (e.target.closest('.bd-turn')) return; x0 = e.clientX; a0 = BD3.ready ? BD3.yaw : bdAngle; bdDragged = false; };
  stage.onpointermove = e => { if (x0 == null) return; const dx = e.clientX - x0; if (Math.abs(dx) > 6) { if (!bdDragged && BD3.ready) { cancelAnimationFrame(BD3.raf); BD3.zoom = BD3.zoomTo; a0 = BD3.yaw; x0 = e.clientX; } bdDragged = true; if (BD3.ready) { BD3.yaw = a0 + (e.clientX - x0) * 0.012; BD3.draw(); } else bdSetAngle(a0 + dx * .7, true); } };
  const end = e => { if (x0 == null) return; x0 = null;
    if (bdDragged) { if (!BD3.ready) bdSetAngle(Math.round(bdAngle / 180) * 180); setTimeout(() => { bdDragged = false; }, 50); }
    else if (BD3.ready && e && e.type === 'pointerup' && e.target === BD3.canvas) {   // a tap on the 3D body: find the muscle under the finger
      const hit = BD3.pick(e); if (hit) bdSelect(hit.k, hit.side); else if (bdSel) bdClose(); } };
  stage.onpointerup = end; stage.onpointerleave = end; stage.onpointercancel = end;

  document.querySelectorAll('#bodyApp .bd-cu').forEach(el => { const v = el.dataset.to; if (v !== '') countUp(el, Number(v)); });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('#bodyApp .bd-ring-fg').forEach(el => { el.style.strokeDasharray = el.dataset.len + ' ' + C; });
    [...$('bdMeter').children].forEach((el, i) => setTimeout(() => el.classList.toggle('on', i < meterOn), (typeof RM !== 'undefined' && RM) ? 0 : 200 + i * 70));
  }));
}
</script>
