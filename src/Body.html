<!-- Body tab: recovery map, weekly set targets and strength scores, all worked out on the phone from the Workout Log history (D.wlog).
     Note: no double slash inside backtick strings in this file. Apps Script's HTML step can cut the line there. -->
<style>
  .bd-hero { position: relative; overflow: hidden; }
  .bd-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: center; margin-bottom: 6px; }
  .bd-stat b { display: block; font-family: var(--display); font-style: italic; font-weight: 800; font-size: 46px; line-height: 1; color: var(--text-primary); }
  .bd-stat span { display: block; margin-top: 4px; font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-secondary); }
  .bd-stage { position: relative; height: 430px; perspective: 1200px; touch-action: pan-y; }
  .bd-flip { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform .9s cubic-bezier(.2,.8,.2,1); }
  .bd-flip.back { transform: rotateY(180deg); }
  .bd-face { position: absolute; inset: 0; display: flex; justify-content: center; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .bd-face.b { transform: rotateY(180deg); }
  .bd-face svg { height: 100%; width: auto; overflow: visible; filter: drop-shadow(0 24px 30px rgba(0,0,0,.6)); }
  .bd-sil { fill: #2a313d; }
  .bd-sil.hl { fill: #333b49; }
  .bd-m { fill: #3a4352; stroke: rgba(0,0,0,.35); stroke-width: 1; cursor: pointer; transition: fill .6s ease, filter .6s ease, opacity .5s ease; }
  .bd-m.fresh { fill: #3d6e72; }
  .bd-m.rec { fill: #e3a33b; filter: drop-shadow(0 0 6px rgba(227,163,59,.45)); }
  .bd-m.hot { fill: #f2546b; filter: drop-shadow(0 0 9px rgba(242,84,107,.6)); }
  .bd-m.sel { stroke: #fff; stroke-width: 2; }
  .bd-enter .bd-m { opacity: 0; }
  .bd-turn { position: absolute; left: 6px; bottom: 6px; width: 46px; height: 46px; border-radius: 23px; border: 1px solid var(--border); background: var(--glass), var(--surface-2);
    color: var(--text-primary); font-size: 20px; display: flex; align-items: center; justify-content: center; }
  .bd-side { position: absolute; right: 8px; bottom: 14px; font-family: var(--display); font-weight: 700; letter-spacing: .14em; font-size: 13px; color: var(--text-muted); text-transform: uppercase; }
  .bd-legend { display: flex; justify-content: center; gap: 16px; font-size: 13px; color: var(--text-secondary); margin-top: 6px; }
  .bd-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
  .bd-info { margin-top: 10px; min-height: 46px; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.04); border: 1px solid var(--border); font-size: 14px; color: var(--text-secondary); }
  .bd-info b { color: var(--text-primary); font-family: var(--display); font-size: 18px; letter-spacing: .04em; }
  /* weekly sets ring */
  .bd-ringwrap { position: relative; width: 210px; height: 210px; margin: 6px auto 4px; }
  .bd-ringwrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .bd-ring-bg { fill: none; stroke: rgba(255,255,255,.06); stroke-width: 16; }
  .bd-ring-fg { fill: none; stroke-width: 16; stroke-linecap: round; transition: stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1); }
  .bd-ring-mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .bd-ring-mid b { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 50px; line-height: 1; }
  .bd-ring-mid > span { font-size: 13px; color: var(--text-muted); margin-top: 2px; }
  .bd-row { display: flex; align-items: center; gap: 12px; padding: 12px 4px; border-top: 1px solid var(--border); cursor: pointer; }
  .bd-row:first-child { border-top: 0; }
  .bd-row svg { flex: 0 0 34px; height: 34px; transform: rotate(-90deg); }
  .bd-row .t { flex: 1; min-width: 0; } .bd-row .t b { display: block; font-size: 16px; } .bd-row .t span { font-size: 13px; color: var(--text-muted); }
  .bd-row .go { text-align: right; } .bd-row .go b { display: block; font-family: var(--display); font-weight: 800; font-size: 22px; line-height: 1; } .bd-row .go span { font-size: 12px; color: var(--text-muted); }
  .bd-sub { display: none; padding: 0 4px 10px 50px; font-size: 14px; color: var(--text-secondary); }
  .bd-sub.open { display: block; animation: bdDrop .35s ease-out; }
  .bd-sub div { display: flex; justify-content: space-between; padding: 4px 0; }
  @keyframes bdDrop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  /* strength */
  .bd-top { display: flex; align-items: center; gap: 16px; }
  .bd-big { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 64px; line-height: .9; min-width: 84px; }
  .bd-meter { flex: 1; display: grid; grid-template-columns: repeat(10, 1fr); gap: 5px; height: 54px; }
  .bd-meter i { display: block; border-radius: 3px; transform: skewX(-18deg); background: rgba(255,255,255,.07); transition: background .3s ease, box-shadow .3s ease; }
  .bd-meter i.on { background: linear-gradient(180deg, #e9ff9e, var(--lime)); box-shadow: 0 0 10px rgba(184,242,62,.35); }
  .bd-meter i:nth-child(n) { height: 100%; }
  .bd-grp { margin-top: 12px; border-radius: 14px; background: rgba(255,255,255,.035); border: 1px solid var(--border); overflow: hidden; }
  .bd-gh { display: flex; align-items: center; gap: 10px; padding: 12px 14px; cursor: pointer; }
  .bd-gh .t { flex: 1; } .bd-gh .t b { font-size: 16px; } .bd-gh .t div { font-family: var(--display); font-style: italic; font-weight: 800; font-size: 26px; line-height: 1.1; }
  .bd-gh .t div small { font-style: normal; font-weight: 600; font-size: 12px; letter-spacing: .1em; color: var(--text-muted); margin-left: 6px; }
  .bd-chip { display: inline-flex; align-items: center; justify-content: center; min-width: 30px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 12px; font-weight: 700; margin-left: 8px; vertical-align: 2px; }
  .bd-chip.up { background: var(--lime); color: var(--lime-ink); } .bd-chip.flat { background: rgba(255,255,255,.14); color: var(--text-primary); } .bd-chip.down { background: #f2c14e; color: #201600; }
  .bd-chev { color: var(--text-muted); transition: transform .3s; } .bd-grp.open .bd-chev { transform: rotate(180deg); }
  .bd-ms { display: none; } .bd-grp.open .bd-ms { display: block; }
  .bd-mrow { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--border); }
  .bd-mrow .t { flex: 0 0 96px; } .bd-mrow .t span { font-size: 14px; color: var(--text-secondary); } .bd-mrow .t b { display: block; font-family: var(--display); font-style: italic; font-weight: 800; font-size: 28px; line-height: 1; }
  .bd-spark { flex: 1; height: 44px; }
  .bd-spark polyline { fill: none; stroke: #e8edf3; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .bd-spark circle { fill: #fff; }
  .bd-spark line { stroke: rgba(255,255,255,.12); stroke-dasharray: 3 4; }
  .bd-draw polyline { stroke-dasharray: 400; stroke-dashoffset: 400; animation: bdDraw 1.2s .15s ease-out forwards; }
  @keyframes bdDraw { to { stroke-dashoffset: 0; } }
  .bd-note { font-size: 13px; color: var(--text-muted); margin-top: 10px; line-height: 1.5; }
  @media (prefers-reduced-motion: reduce) { .bd-flip, .bd-ring-fg, .bd-m { transition: none; } .bd-draw polyline { animation: none; stroke-dashoffset: 0; } }
</style>
<script>
// ---------- What each exercise works. p = main muscles, s = helpers (count half). kind: w = weighted (score from estimated 1-rep max vs bodyweight),
// r = reps, h = hold seconds. ref = the result that scores 60 ("solid intermediate"), so 100 is well above average. Rough guides, not lab numbers.
const BD_MUSCLES = {
  chest: ['Chest', 'push'], shoulders: ['Shoulders', 'push'], triceps: ['Triceps', 'push'],
  back: ['Back', 'pull'], biceps: ['Biceps', 'pull'], traps: ['Traps & neck', 'pull'], forearms: ['Forearms', 'pull'],
  quads: ['Quads', 'legs'], hamstrings: ['Hamstrings', 'legs'], glutes: ['Glutes', 'legs'], calves: ['Calves', 'legs'],
  abs: ['Abs', 'core'], obliques: ['Obliques', 'core'], lowback: ['Lower back', 'core'],
};
const BD_GROUPS = { push: ['Push muscles', 12], pull: ['Pull muscles', 12], legs: ['Leg muscles', 15], core: ['Core', 8] };   // name, weekly set target
const BD_COLORS = { push: '#b8f23e', pull: '#2dd4bf', legs: '#f2546b', core: '#a78bfa' };
const BD_EX = {
  'Goblet squat': { p: ['quads'], s: ['glutes', 'abs'], k: 'w', ref: .45 },
  'Dumbbell floor press': { p: ['chest'], s: ['triceps', 'shoulders'], k: 'w', ref: .35 },
  'One-arm dumbbell row': { p: ['back'], s: ['biceps', 'forearms'], k: 'w', ref: .45 },
  'Dumbbell Romanian deadlift': { p: ['hamstrings'], s: ['glutes', 'lowback'], k: 'w', ref: .4 },
  'Dumbbell shoulder press': { p: ['shoulders'], s: ['triceps'], k: 'w', ref: .25 },
  'Band pull-apart': { p: ['back'], s: ['shoulders'], k: 'r', ref: 20 },
  'Copenhagen plank': { p: ['obliques'], s: ['abs'], k: 'h', ref: 30 },
  'Side plank': { p: ['obliques'], s: ['abs'], k: 'h', ref: 60 },
  'Bulgarian split squat': { p: ['quads', 'glutes'], s: ['hamstrings'], k: 'w', ref: .3 },
  'Single-leg Romanian deadlift': { p: ['hamstrings', 'glutes'], s: ['lowback'], k: 'w', ref: .3 },
  'Dumbbell hip thrust': { p: ['glutes'], s: ['hamstrings'], k: 'w', ref: .6 },
  'Heel-raised goblet squat': { p: ['quads'], s: ['glutes'], k: 'w', ref: .35 },
  'Standing calf raise': { p: ['calves'], s: [], k: 'w', ref: .3 },
  'Dead bug': { p: ['abs'], s: ['obliques'], k: 'r', ref: 12 },
  'Split squat bottom hold': { p: ['quads'], s: ['glutes'], k: 'h', ref: 45 },
  'Single-leg glute bridge hold': { p: ['glutes'], s: ['hamstrings'], k: 'h', ref: 45 },
  'Push-up': { p: ['chest'], s: ['triceps', 'shoulders', 'abs'], k: 'r', ref: 25 },
  'Band row': { p: ['back'], s: ['biceps'], k: 'r', ref: 15 },
  'Incline dumbbell press': { p: ['chest', 'shoulders'], s: ['triceps'], k: 'w', ref: .3 },
  'Dumbbell lateral raise': { p: ['shoulders'], s: [], k: 'w', ref: .1 },
  'Dumbbell curl': { p: ['biceps'], s: ['forearms'], k: 'w', ref: .18 },
  'Overhead triceps extension': { p: ['triceps'], s: [], k: 'w', ref: .25 },
  'Push-up bottom hold': { p: ['chest'], s: ['triceps'], k: 'h', ref: 30 },
  "Dumbbell farmer's hold": { p: ['forearms', 'traps'], s: ['abs'], k: 'h', ref: 60 },
  'Supine chin tuck': { p: ['traps'], s: [], k: 'r', ref: 15 },
  'Neck isometric hold': { p: ['traps'], s: [], k: 'h', ref: 10 },
  'Prone neck extension': { p: ['traps'], s: [], k: 'r', ref: 15 },
  'Side-lying neck raise': { p: ['traps'], s: [], k: 'r', ref: 15 },
  'Dumbbell shrug': { p: ['traps'], s: ['forearms'], k: 'w', ref: .45 },
  'Single-leg deficit calf raise': { p: ['calves'], s: [], k: 'r', ref: 15 },
  'Seated dumbbell calf raise': { p: ['calves'], s: [], k: 'w', ref: .3 },
  'Tibialis raise': { p: ['calves'], s: [], k: 'r', ref: 20 },
  'Single-leg calf raise hold': { p: ['calves'], s: [], k: 'h', ref: 30 },
};

function bdBest(reps) { const n = String(reps || '').split(/[^0-9.]+/).map(Number).filter(x => x > 0); return n.length ? Math.max(...n) : 0; }
function bdBodyweight() { const w = (D.series || []).filter(x => x.w).slice(-1)[0]; return (w && w.w) || D.targets.start || 150; }
function bdMonday(k) { const [y, m, d] = k.split('-').map(Number), t = new Date(y, m - 1, d); return addDays(k, -((t.getDay() + 6) % 7)); }
/** One logged row's score (0-99), or null when it can't be scored (no weight on a weighted move, no reps). */
function bdScore(ex, sets, reps, w, bw) {
  const m = BD_EX[ex]; if (!m) return null;
  const r = bdBest(reps); if (!r) return null;
  let v;
  if (m.k === 'w') { if (!w) return null; v = (w * (1 + r / 30) / bw) / m.ref; }   // Epley estimate of a 1-rep max, as a share of bodyweight
  else v = r / m.ref;
  return Math.max(1, Math.min(99, Math.round(60 * v)));
}

/** Everything the tab shows, worked out from the log. */
function bdModel() {
  const log = D.wlog || [], bw = bdBodyweight(), now = Date.now(), wk = bdMonday(D.today);
  const fat = {}, last = {}, weekSets = {}, groupSets = { push: 0, pull: 0, legs: 0, core: 0 }, byWeek = {};
  Object.keys(BD_MUSCLES).forEach(k => { fat[k] = 0; weekSets[k] = 0; });
  log.forEach(([d, , ex, sets, reps, w]) => {
    const m = BD_EX[ex]; if (!m) return;
    const n = sets || bdBest(reps) && 1 || 0, [y, mo, da] = d.split('-').map(Number);
    const hrs = (now - new Date(y, mo - 1, da, 12).getTime()) / 3600000;
    const decay = Math.exp(-Math.max(0, hrs) / 30);   // fatigue fades with a ~30 h time constant: most of it is gone after 2-3 days
    m.p.forEach(k => { fat[k] += n * decay; if (!last[k] || d > last[k]) last[k] = d; });
    m.s.forEach(k => { fat[k] += n * .5 * decay; });
    if (d >= wk) { m.p.forEach(k => { weekSets[k] += n; }); groupSets[BD_MUSCLES[m.p[0]][1]] += n; }
    const sc = bdScore(ex, sets, reps, w, bw); if (sc == null) return;
    const wkey = bdMonday(d);
    m.p.forEach(k => { const b = (byWeek[k] = byWeek[k] || {}); b[wkey] = Math.max(b[wkey] || 0, sc); });
  });
  const fresh = {}; Object.keys(fat).forEach(k => { fresh[k] = Math.max(0, Math.round(100 - fat[k] * 14)); });
  // weekly strength line per muscle, last 8 weeks, carrying the last known score forward
  const weeks = []; for (let i = 7; i >= 0; i--) weeks.push(addDays(wk, -7 * i));
  const line = {}, score = {};
  Object.keys(BD_MUSCLES).forEach(k => {
    let cur = null; const pts = [];
    const before = Object.keys(byWeek[k] || {}).filter(x => x < weeks[0]).sort().pop(); if (before) cur = byWeek[k][before];
    weeks.forEach(x => { if (byWeek[k] && byWeek[k][x] != null) cur = byWeek[k][x]; pts.push(cur); });
    line[k] = pts; score[k] = cur;
  });
  const gScore = {}, gLine = {};
  Object.keys(BD_GROUPS).forEach(g => {
    const ks = Object.keys(BD_MUSCLES).filter(k => BD_MUSCLES[k][1] === g && score[k] != null);
    gScore[g] = ks.length ? Math.round(ks.reduce((a, k) => a + score[k], 0) / ks.length) : null;
    gLine[g] = weeks.map((_, i) => { const v = ks.map(k => line[k][i]).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; });
  });
  const gs = Object.values(gScore).filter(x => x != null);
  const overall = gs.length ? Math.round(gs.reduce((a, b) => a + b, 0) / gs.length) : null;
  const lastAny = log.reduce((a, r) => (BD_EX[r[2]] && r[0] > a ? r[0] : a), '');
  return { fresh, last, weekSets, groupSets, line, score, gScore, gLine, overall, weeks, lastAny, bw };
}
function bdState(f) { return f >= 85 ? 'fresh' : f >= 50 ? 'rec' : 'hot'; }
function bdTrend(pts) { const v = pts.filter(x => x != null); if (v.length < 2) return 'flat'; const d = v[v.length - 1] - v[Math.max(0, v.length - 4)]; return d >= 2 ? 'up' : d <= -2 ? 'down' : 'flat'; }
const BD_ARROW = { up: '↗', flat: '→', down: '↘' };

/** Count a number up from 0, for the big figures. */
function countUp(el, to, ms) {
  if (!el) return; if (to == null) { el.textContent = '—'; return; }
  if (typeof RM !== 'undefined' && RM) { el.textContent = to; return; }
  const t0 = performance.now(), dur = ms || 900;
  const step = t => { const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3); el.textContent = Math.round(to * e); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

// ---------- The figure: an original, simple athletic outline built from rounded shapes. Each coloured region has data-m = a muscle key. ----------
function bdFigure(side) {
  const S = 'class="bd-sil"', cap = (x, y, w, h, r, rot) => `<rect ${S} x="${x - w / 2}" y="${y - h / 2}" width="${w}" height="${h}" rx="${r}" transform="rotate(${rot || 0} ${x} ${y})"/>`;
  const sil = `<circle ${S} cx="100" cy="30" r="19"/>${cap(100, 58, 18, 18, 6)}
    <path ${S} d="M62 74 Q100 64 138 74 L142 110 Q136 150 128 186 Q100 196 72 186 Q64 150 58 110 Z"/>
    <path ${S} d="M72 182 Q100 192 128 182 L132 214 Q100 226 68 214 Z"/>
    ${cap(52, 120, 20, 66, 10, 12)}${cap(148, 120, 20, 66, 10, -12)}${cap(40, 186, 16, 64, 8, 8)}${cap(160, 186, 16, 64, 8, -8)}
    <circle ${S} cx="36" cy="226" r="9"/><circle ${S} cx="164" cy="226" r="9"/>
    ${cap(84, 262, 30, 96, 15, 3)}${cap(116, 262, 30, 96, 15, -3)}${cap(85, 350, 22, 84, 11, 2)}${cap(115, 350, 22, 84, 11, -2)}
    <ellipse ${S} cx="84" cy="398" rx="13" ry="7"/><ellipse ${S} cx="116" cy="398" rx="13" ry="7"/>`;
  const M = (k, el) => el.replace(/^<(\w+)/, `<$1 class="bd-m" data-m="${k}"`);
  const e = (cx, cy, rx, ry, rot) => `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" transform="rotate(${rot || 0} ${cx} ${cy})"/>`;
  const front = [
    M('traps', `<path d="M86 64 L100 70 L114 64 L126 76 L100 80 L74 76 Z"/>`),
    M('shoulders', e(64, 88, 13, 12, -20)), M('shoulders', e(136, 88, 13, 12, 20)),
    M('chest', `<path d="M76 92 Q88 86 99 92 L99 116 Q86 122 74 112 Z"/>`), M('chest', `<path d="M124 92 Q112 86 101 92 L101 116 Q114 122 126 112 Z"/>`),
    M('biceps', e(53, 122, 8, 20, 12)), M('biceps', e(147, 122, 8, 20, -12)),
    M('forearms', e(41, 184, 7, 22, 8)), M('forearms', e(159, 184, 7, 22, -8)),
    M('abs', `<rect x="88" y="122" width="24" height="58" rx="8"/>`),
    M('obliques', e(79, 152, 7, 24, -6)), M('obliques', e(121, 152, 7, 24, 6)),
    M('quads', e(84, 256, 13, 40, 3)), M('quads', e(116, 256, 13, 40, -3)),
    M('calves', e(84, 346, 8, 28, 2)), M('calves', e(116, 346, 8, 28, -2)),
  ].join('');
  const back = [
    M('traps', `<path d="M100 64 L122 76 L112 108 L100 116 L88 108 L78 76 Z"/>`),
    M('shoulders', e(64, 88, 13, 12, -20)), M('shoulders', e(136, 88, 13, 12, 20)),
    M('back', `<path d="M76 96 L92 110 L96 160 Q84 166 74 150 Q66 124 76 96 Z"/>`), M('back', `<path d="M124 96 L108 110 L104 160 Q116 166 126 150 Q134 124 124 96 Z"/>`),
    M('triceps', e(53, 124, 8, 20, 12)), M('triceps', e(147, 124, 8, 20, -12)),
    M('forearms', e(41, 184, 7, 22, 8)), M('forearms', e(159, 184, 7, 22, -8)),
    M('lowback', `<rect x="88" y="160" width="24" height="24" rx="8"/>`),
    M('glutes', e(87, 204, 15, 14, 0)), M('glutes', e(113, 204, 15, 14, 0)),
    M('hamstrings', e(84, 262, 12, 36, 3)), M('hamstrings', e(116, 262, 12, 36, -3)),
    M('calves', e(85, 340, 10, 26, 2)), M('calves', e(115, 340, 10, 26, -2)),
  ].join('');
  return `<svg viewBox="20 6 160 404" role="img" aria-label="Muscle recovery, ${side} view">${sil}${side === 'front' ? front : back}</svg>`;
}

let bdBack = false, bdSel = null, bdOpenGrp = {};
function renderBody() {
  if (!D || !$('bodyApp')) return;
  const M = bdModel(), first = !$('bodyApp').dataset.ready;
  const freshCount = Object.keys(BD_MUSCLES).filter(k => M.fresh[k] >= 85).length;
  const since = M.lastAny ? Math.max(0, Math.round((new Date(D.today) - new Date(M.lastAny)) / 86400000)) : null;
  const totSets = Object.values(M.groupSets).reduce((a, b) => a + b, 0), totTarget = Object.values(BD_GROUPS).reduce((a, g) => a + g[1], 0);
  const pct = Math.min(100, Math.round(totSets / totTarget * 100));
  const R = 84, C = 2 * Math.PI * R, gk = Object.keys(BD_GROUPS), quarter = C / gk.length, gap = 10;
  const arcs = gk.map((g, i) => { const done = Math.min(1, M.groupSets[g] / BD_GROUPS[g][1]), len = Math.max(0, (quarter - gap) * done);
    return `<circle class="bd-ring-bg" cx="100" cy="100" r="${R}" style="stroke-dasharray:${quarter - gap} ${C};stroke-dashoffset:${-i * quarter}"/>`
      + (len > 0 ? `<circle class="bd-ring-fg" data-len="${len}" cx="100" cy="100" r="${R}" stroke="${BD_COLORS[g]}" style="stroke-dasharray:0 ${C};stroke-dashoffset:${-i * quarter}"/>` : ''); }).join('');   // no arc at all when empty: a round cap would draw a dot
  const mini = (g) => { const r = 13, c = 2 * Math.PI * r, d = Math.min(1, M.groupSets[g] / BD_GROUPS[g][1]);
    return `<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="${r}" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="5"/>${d > 0 ? `<circle cx="17" cy="17" r="${r}" fill="none" stroke="${BD_COLORS[g]}" stroke-width="5" stroke-linecap="round" stroke-dasharray="${c * d} ${c}"/>` : ''}</svg>`; };
  const rows = gk.map(g => { const ms = Object.keys(BD_MUSCLES).filter(k => BD_MUSCLES[k][1] === g), left = Math.max(0, BD_GROUPS[g][1] - M.groupSets[g]);
    return `<div class="bd-row" onclick="this.nextElementSibling.classList.toggle('open')">${mini(g)}<div class="t"><b>${BD_GROUPS[g][0]}</b><span>${M.groupSets[g]} / ${BD_GROUPS[g][1]} sets</span></div>
      <div class="go"><b>${left || '✓'}</b><span>${left ? 'to go' : 'done'}</span></div></div>
      <div class="bd-sub">${ms.map(k => `<div><span>${BD_MUSCLES[k][0]}</span><span>${M.weekSets[k]} sets</span></div>`).join('')}</div>`; }).join('');
  const spark = pts => { const v = pts.map((x, i) => [i, x]).filter(p => p[1] != null); if (!v.length) return '<div class="muted" style="flex:1;font-size:13px">Log weights and reps to score</div>';
    const lo = Math.min(...v.map(p => p[1])) - 4, hi = Math.max(...v.map(p => p[1])) + 4, X = i => 6 + i * (148 / 7), Y = y => 40 - (y - lo) / Math.max(1, hi - lo) * 32;
    const avg = v.reduce((a, p) => a + p[1], 0) / v.length;
    return `<svg class="bd-spark bd-draw" viewBox="0 0 160 44" preserveAspectRatio="none"><line x1="0" x2="160" y1="${Y(avg)}" y2="${Y(avg)}"/><polyline points="${v.map(p => X(p[0]) + ',' + Y(p[1])).join(' ')}"/>${v.map(p => `<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="3"/>`).join('')}</svg>`; };
  const meterOn = M.overall == null ? 0 : Math.round(M.overall / 10);
  const groups = gk.map(g => { const ms = Object.keys(BD_MUSCLES).filter(k => BD_MUSCLES[k][1] === g), tr = bdTrend(M.gLine[g]);
    return `<div class="bd-grp ${bdOpenGrp[g] ? 'open' : ''}" data-g="${g}"><div class="bd-gh" onclick="bdOpenGrp['${g}']=!bdOpenGrp['${g}'];this.parentElement.classList.toggle('open')">
      <div class="t"><b>${BD_GROUPS[g][0]}</b>${M.gScore[g] != null ? `<span class="bd-chip ${tr}">${BD_ARROW[tr]}</span>` : ''}<div><span class="bd-cu" data-to="${M.gScore[g] ?? ''}">${M.gScore[g] ?? '—'}</span><small>STRENGTH</small></div></div><span class="bd-chev">⌄</span></div>
      <div class="bd-ms">${ms.map(k => `<div class="bd-mrow"><div class="t"><span>${BD_MUSCLES[k][0]}</span><b>${M.score[k] ?? '—'}</b></div>${spark(M.line[k])}</div>`).join('')}</div></div>`; }).join('');
  const label = { fresh: 'fresh, ready to train', rec: 'recovering', hot: 'worked hard, needs rest' };

  $('bodyApp').innerHTML = `
    <div class="card bd-hero ${first ? 'bd-enter' : ''}">
      <h2>Recovery</h2>
      <div class="bd-stats"><div class="bd-stat"><b class="bd-cu" data-to="${since ?? ''}">${since ?? '—'}</b><span>${since === 1 ? 'Day' : 'Days'} since<br>last workout</span></div>
        <div class="bd-stat"><b class="bd-cu" data-to="${freshCount}">${freshCount}</b><span>Fresh muscle<br>groups of ${Object.keys(BD_MUSCLES).length}</span></div></div>
      <div class="bd-stage" id="bdStage"><div class="bd-flip ${bdBack ? 'back' : ''}" id="bdFlip"><div class="bd-face f">${bdFigure('front')}</div><div class="bd-face b">${bdFigure('back')}</div></div>
        <button class="bd-turn" onclick="bdTurn()" aria-label="Turn the figure around">⟲</button><div class="bd-side" id="bdSide">${bdBack ? 'Back' : 'Front'}</div></div>
      <div class="bd-legend"><span><i style="background:#3d6e72"></i>Fresh</span><span><i style="background:#e3a33b"></i>Recovering</span><span><i style="background:#f2546b"></i>Worked</span></div>
      <div class="bd-info" id="bdInfo">Tap a muscle to see when you last trained it. Swipe or tap ⟲ to turn around.</div>
    </div>
    <div class="card"><h2>This week's sets</h2>
      <div class="bd-ringwrap"><svg viewBox="0 0 200 200">${arcs}</svg><div class="bd-ring-mid"><b><span class="bd-cu" data-to="${pct}">${pct}</span>%</b><span>${totSets} of ${totTarget} sets</span></div></div>
      <div class="muted" style="text-align:center;margin-bottom:6px">${fmtDate(bdMonday(D.today), { month: 'short', day: 'numeric' })} – ${fmtDate(addDays(bdMonday(D.today), 6), { month: 'short', day: 'numeric' })} · tap a group for each muscle</div>
      ${rows}</div>
    <div class="card"><h2>Strength</h2>
      <div class="bd-top"><div class="bd-big bd-cu" data-to="${M.overall ?? ''}">${M.overall ?? '—'}</div><div class="bd-meter" id="bdMeter">${Array.from({ length: 10 }, () => '<i></i>').join('')}</div></div>
      <div class="muted" style="margin-top:6px">Overall strength, 0–100 · 60 is a solid intermediate for your bodyweight (${Math.round(M.bw)} lb)</div>
      ${groups}
      <p class="bd-note">Scores come from your best set of each exercise: weight and reps turn into an estimated one-rep max, compared with your bodyweight. Bodyweight moves use reps, holds use seconds. They are rough guides to track your own progress, not lab tests. Log the weight you used to get scores for dumbbell moves.</p></div>`;
  $('bodyApp').dataset.ready = 1;

  // paint recovery colours, wire taps and swipes
  document.querySelectorAll('#bodyApp .bd-m').forEach((el, i) => {
    const k = el.dataset.m, st = bdState(M.fresh[k]);
    el.classList.add(st); if (bdSel === k) el.classList.add('sel');
    if (first && !(typeof RM !== 'undefined' && RM)) setTimeout(() => { el.style.opacity = 1; }, 120 + i * 25); else el.style.opacity = 1;
    el.addEventListener('click', () => {
      bdSel = k; document.querySelectorAll('#bodyApp .bd-m').forEach(x => x.classList.toggle('sel', x.dataset.m === k));
      const f = M.fresh[k], F = (100 - f) / 14, days = f >= 85 ? 0 : Math.max(1, Math.ceil(30 * Math.log(F / (15 / 14)) / 24));   // hours until fatigue decays to the "fresh" line
      $('bdInfo').innerHTML = `<b>${BD_MUSCLES[k][0]}</b> · ${label[bdState(f)]}<br>${M.last[k] ? 'Last trained ' + fmtDate(M.last[k]) : 'Not trained in the last 16 weeks'} · ${M.weekSets[k]} sets this week${f < 85 ? ` · about ${days} day${days > 1 ? 's' : ''} to fresh` : ''}`;
    });
  });
  const stage = $('bdStage'); let x0 = null;
  stage.onpointerdown = e => { x0 = e.clientX; };
  stage.onpointerup = e => { if (x0 != null && Math.abs(e.clientX - x0) > 40) bdTurn(); x0 = null; };
  // animate numbers, ring and meter
  document.querySelectorAll('#bodyApp .bd-cu').forEach(el => { const v = el.dataset.to; if (v !== '') countUp(el, Number(v)); });
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.querySelectorAll('#bodyApp .bd-ring-fg').forEach(el => { el.style.strokeDasharray = el.dataset.len + ' ' + C; });
    [...$('bdMeter').children].forEach((el, i) => setTimeout(() => el.classList.toggle('on', i < meterOn), (typeof RM !== 'undefined' && RM) ? 0 : 200 + i * 70));
  }));
}
function bdTurn() { bdBack = !bdBack; $('bdFlip').classList.toggle('back', bdBack); $('bdSide').textContent = bdBack ? 'Back' : 'Front'; if (navigator.vibrate) navigator.vibrate(8); }
</script>
