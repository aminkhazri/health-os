<script>
/**
 * Animated demo figure, drawn in code (no video, no images, no libraries).
 *
 * How it works: the figure is a skeleton. A "pose" is a set of angles in degrees, one per body segment. A move is a

 * ("interpolation", eased so limbs speed up and slow down naturally), turn the angles into joint positions

 *    left out, it copies the near side.

 *

 * the hip follows the foot). both pins the far foot the same way; ankle2 pins it somewhere else. hand, hand2, hands pin hands.
 * elbow / knee / knee2 flip the bend direction. props draws equipment. hot names the working parts (drawn in the accent colour).
 * view crops the drawing. still is the time shown when animation is switched off.
 *

  const WID = { thigh: 13, shin: 11, armU: 10, armL: 9, foot: 9, torso: 17 };

      far: Object.assign(leg(p.legU2, p.legL2, p.foot2, farLegPin, fig.knee2 || -1), arm(p.armU2, p.armL2, fig.hand2 || fig.hands)) };
  }

      near: Object.assign(leg(hipL, p.legU, p.legL, p.foot, fig.ankleL, 1), arm(shL, p.armU, p.armL, fig.handL, -1)),
      far: Object.assign(leg(hipR, p.legU2, p.legL2, p.foot2, fig.ankleR, -1), arm(shR, p.armU2, p.armL2, fig.handR, 1)) };

  const n1 = v => v.toFixed(1);

  /** A flat-ended stripe across a limb (sleeve cuff, sock top). */

    const at = (deg, rr) => [c[0] + rr * (Math.cos(rad(deg)) * face[0] + Math.sin(rad(deg)) * up[0]), c[1] + rr * (Math.cos(rad(deg)) * face[1] + Math.sin(rad(deg)) * up[1])];

      + `<path class="fg-mouth" d="M${n1(off(-2.6, -5)[0])},${n1(off(-2.6, -5)[1])} Q${n1(off(0, -6.6)[0])},${n1(off(0, -6.6)[1])} ${n1(off(2.6, -5)[0])},${n1(off(2.6, -5)[1])}"/>`;

      + taper(hip, l.knee, WID.thigh + 1, WID.shin, 'fg-skin') + taper(hip, mix(hip, l.knee, 0.56), WID.thigh + 3, WID.thigh + 2.5, 'fg-shorts')
      + taper(l.ank, l.toe, WID.foot, 7, 'fg-boot');

    } else {

      out.push(far(limbArm(j.far, j.sh) + limbLeg(j.far, j.hip)));
      if (hot.includes('torso')) out.push(`<path class="fg-l fg-glowline" stroke-width="${WID.torso + 7}" ${curve}/>`);
      out.push(`<path class="fg-l fg-kitline" stroke-width="${WID.torso}" ${curve}/>`, taper(j.hip, mix(j.hip, j.mid, 0.42), WID.torso, WID.torso, 'fg-shorts'));

        const h = pt(k), el = k === 'hand2' ? j.far.el : j.near.el; let dx = h[0] - el[0], dy = h[1] - el[1]; const m = Math.hypot(dx, dy) || 1; dx /= m; dy /= m;
        if (q[2] === 'dot' || k === 'knee') return out.push(`<circle class="fg-dbdot" cx="${n1(h[0])}" cy="${n1(h[1])}" r="7"/>`);
        const d = q[2] === 'p' ? [-dy, dx] : q[2] === 'v' ? [0, 1] : q[2] === 'h' ? [1, 0] : [dx, dy], o = q[2] === 'a' ? 6 : 0;

  }

  const thrustLow = { x: 120.6, y: 182.8, torso: -55, head: 12, armU: 55, armL: 55, foot: 90 }, thrustTop = { x: 130, y: 153, torso: -90, head: 25, armU: 90, armL: 80, foot: 90 };
  const bridgeLow = { x: 112, y: 189, torso: -90, head: 10, armU: 85, armL: 90, legU2: 100, legL2: 100, foot: 90, foot2: 150 };
  const bridgeTop = { x: 106, y: 165, torso: -118.6, head: 12, armU: 80, armL: 90, legU2: 115, legL2: 115, foot: 90, foot2: 160 };

  const calfLeg = { legU2: 0, legL2: -80, foot2: -80 }, seated = { x: 95, y: 153, torso: 5, head: -4, armU: 35, armL: 60 };
