<script>
/**
 * 3D demo figure. Loads a free rigged human model and poses it with the same keyframes the 2D figure uses.
 *
 * How it works:
 *  - Three.js (a 3D library) and the model are fetched from a public CDN the first time a demo is opened, then cached by the browser.
 *  - A rigged model has a skeleton of "bones". Every frame we ask the 2D engine (Figure.html) where each joint is,
 *    lift those points into 3D, and turn each bone so it points from its joint to the next one.
 *  - Turning a bone needs two directions: where it points, and which way its hinge (knee, elbow) faces. Together they pin
 *    the rotation down completely, so limbs do not twist at random.
 *  - Working muscles are tinted by "skin weights": every point on the body surface knows which bones move it, so we colour
 *    the points that belong to the working bones.
 *
 * If anything fails to load (offline, no WebGL), Figure.html keeps showing the 2D figure.
 */
(function (root) {

  const LIB = CDN + 'npm/three@0.160.0/+esm', LOADER = CDN + 'npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js/+esm';

  const MODEL_REV = 'c0691b7f0a424f6f06c48eaa8c4919e56a619880', MODEL = CDN + 'gh/aminkhazri/health-os@' + MODEL_REV + '/models/athlete.glb';
  const FALLBACK = CDN + 'gh/mrdoob/three.js@r160/examples/models/gltf/Xbot.glb';   // "X Bot" sample character, used if the athlete cannot load
  const HOT = { thigh: ['UpLeg'], shin: ['Leg'], foot: ['Foot', 'ToeBase'], armU: ['Arm', 'Shoulder'], armL: ['ForeArm'], torso: ['Spine', 'Spine1', 'Spine2'], head: ['Neck'] };
  const LOOK = { body: 0xdfe5ec, joints: 0x4a5666, hot: 0xff4a2a, mat: 0x1d232c, block: 0x2b3542, steel: 0x8a929d, band: 0xf0c33c };   // hot = working muscles, glowing warm red
  // A few moves are drawn in 2D from an unusual angle. This says how to stand them up in 3D:
  //   side = lying on one side, chest toward the viewer · up / down = lying face up / face down, drawn from above · sit = sitting, drawn from above
  const MODE = { 'Copenhagen plank': 'side', 'Side plank': 'side', 'Side-lying neck raise': 'side', 'Supine spinal twist': 'up', 'Frog stretch': 'down', '90/90 hip switch': 'sit' };
  const HIP_H = { up: 0.11, down: 0.2, sit: 0.1 };

  const GRIP = ['Goblet squat', 'Heel-raised goblet squat', 'Overhead triceps extension', 'Deep squat hold'];
  const rad = d => d * Math.PI / 180;
  let S = null, loading = null;

  function load() {
    if (!loading) loading = Promise.all([import(LIB), import(LOADER), import(ROOM).catch(() => null)])
      .then(([T, L, R]) => new Promise((ok, fail) => {

  function setup(T, model, R, anims) {
    const V = (x, y, z) => new T.Vector3(x || 0, y || 0, z || 0), Q = () => new T.Quaternion();
    const fov = 26, scene = new T.Scene(), camera = new T.PerspectiveCamera(fov, 240 / 212, 0.1, 60);

    scene.add(new T.HemisphereLight(0xffffff, 0x39424f, 1.5));
    const key = new T.DirectionalLight(0xffffff, 2.4); key.castShadow = true; key.shadow.mapSize.set(1024, 1024);
    Object.assign(key.shadow.camera, { left: -2.2, right: 2.2, top: 2.6, bottom: -1, near: 0.5, far: 12 }); key.shadow.bias = -0.0015;
    const rim = new T.DirectionalLight(0x9fd8ff, 1.1);

    const fade = document.createElement('canvas'); fade.width = fade.height = 256;
    const fc = fade.getContext('2d'), fg = fc.createRadialGradient(128, 128, 10, 128, 128, 128);
    fg.addColorStop(0, 'rgba(58,70,86,0.45)'); fg.addColorStop(0.55, 'rgba(40,49,61,0.3)'); fg.addColorStop(1, 'rgba(27,34,44,0)');
    fc.fillStyle = fg; fc.fillRect(0, 0, 256, 256);
    const floor = new T.Group(), pool = new T.Mesh(new T.CircleGeometry(2.6, 64), new T.MeshBasicMaterial({ map: new T.CanvasTexture(fade), transparent: true, depthWrite: false }));
    const shade = new T.Mesh(new T.CircleGeometry(2.6, 32), new T.ShadowMaterial({ opacity: 0.45 })); shade.receiveShadow = true; shade.position.z = 0.002;
    pool.material.map.colorSpace = T.SRGBColorSpace;
    floor.add(pool, shade); floor.rotation.x = -Math.PI / 2; scene.add(floor);
    // exercise mat: a dark slab with rounded corners, its top surface exactly at floor height
    const mw = 2.2, md = 0.95, mr = 0.06, ms = new T.Shape();
    ms.moveTo(-mw / 2 + mr, -md / 2); ms.lineTo(mw / 2 - mr, -md / 2); ms.quadraticCurveTo(mw / 2, -md / 2, mw / 2, -md / 2 + mr); ms.lineTo(mw / 2, md / 2 - mr);
    ms.quadraticCurveTo(mw / 2, md / 2, mw / 2 - mr, md / 2); ms.lineTo(-mw / 2 + mr, md / 2); ms.quadraticCurveTo(-mw / 2, md / 2, -mw / 2, md / 2 - mr); ms.lineTo(-mw / 2, -md / 2 + mr); ms.quadraticCurveTo(-mw / 2, -md / 2, -mw / 2 + mr, -md / 2);
    const mat3 = new T.Mesh(new T.ExtrudeGeometry(ms, { depth: 0.014, bevelEnabled: false }), new T.MeshStandardMaterial({ color: LOOK.mat, roughness: 0.92, metalness: 0 }));
    mat3.rotation.x = -Math.PI / 2; mat3.receiveShadow = true; const matRig = new T.Group(); matRig.add(mat3); mat3.position.y = -0.014; scene.add(matRig);
    const props = new T.Group(); scene.add(props);

    // --- the model: find its bones and skinned meshes, face it toward +Z, give it our own materials
    const rig = new T.Group(); rig.add(model); scene.add(rig);
    const B = {}, meshes = [];
    model.traverse(o => {
      if (o.isBone) B[o.name.replace(/^mixamorig:?/, '')] = o;

    model.updateMatrixWorld(true);
    if (wp('RightToeBase').z < wp('RightFoot').z) { model.rotation.y = Math.PI; model.updateMatrixWorld(true); }
    meshes.forEach(m => {
      const src = m.material, name = src.name || '', own = /^(Body|Shorts)$/.test(name), joints = /joint/i.test(name || m.name);
      m.userData.base = own ? src.color.clone() : new T.Color(joints ? LOOK.joints : LOOK.body);   // the athlete brings its own colours; the fallback mannequin gets ours
      m.userData.tint = own ? name === 'Body' : true;                                              // working muscles glow on the body; the shorts stay black
      m.material = new T.MeshStandardMaterial({ vertexColors: true, roughness: own ? src.roughness : joints ? 0.45 : 0.62, metalness: own ? src.metalness : joints ? 0.3 : 0.02,
        emissive: own && src.emissive ? src.emissive.clone() : new T.Color(0), emissiveIntensity: own ? (src.emissiveIntensity || 1) : 1, envMapIntensity: 1.0 });
      m.geometry.setAttribute('color', new T.BufferAttribute(new Float32Array(m.geometry.attributes.position.count * 3), 3));
    });

    // relax the hands: the model's rest pose has flat, spread fingers, so curl each finger joint toward the palm once
    Object.keys(B).filter(n => /Hand(Thumb|Index|Middle|Ring|Pinky)[123]$/.test(n)).map(n => {
      const b = B[n], f = b.children[0] ? b.children[0].getWorldPosition(V()).sub(b.getWorldPosition(V())).normalize() : null;
      return f && { b, axis: V().crossVectors(f, V(0, -1, 0)).normalize(), pq: b.parent.getWorldQuaternion(Q()), deg: /Thumb/.test(n) ? 18 : /1$/.test(n) ? 38 : 55 };
    }).filter(Boolean).forEach(o => {
      const turn = Q().setFromAxisAngle(o.axis, rad(o.deg));
      o.b.quaternion.premultiply(o.pq.clone().invert().multiply(turn).multiply(o.pq));
    });
    model.updateMatrixWorld(true);

    // --- rest pose: for each bone we steer, remember its orientation, the way it points, and its hinge axis
    const CH = { Hips: 'Spine1', Spine2: 'Neck', Neck: 'Head' };
    ['Right', 'Left'].forEach(s => Object.assign(CH, { [s + 'UpLeg']: s + 'Leg', [s + 'Leg']: s + 'Foot', [s + 'Foot']: s + 'ToeBase', [s + 'Arm']: s + 'ForeArm', [s + 'ForeArm']: s + 'Hand' }));
    const rest = {};
    Object.keys(CH).forEach(n => { rest[n] = { q: B[n].getWorldQuaternion(Q()), d: wp(CH[n]).sub(wp(n)).normalize(), n: V(1, 0, 0) }; });
    // elbows hinge at right angles to the arm and to straight ahead, whatever angle the arms rest at (T-pose or A-pose)
    ['Right', 'Left'].forEach(s => { const n = V().crossVectors(rest[s + 'Arm'].d, V(0, 0, 1)).normalize(); rest[s + 'Arm'].n = n; rest[s + 'ForeArm'].n = n.clone(); });
    const len = {};
    ['Right', 'Left'].forEach(s => {
      [['UpLeg', 'Leg'], ['Leg', 'Foot'], ['Arm', 'ForeArm'], ['ForeArm', 'Hand']].forEach(([a, b]) => { len[s + a] = wp(s + a).distanceTo(wp(s + b)); });
      rest[s + 'Hand'] = { q: B[s + 'Hand'].getWorldQuaternion(Q()), d: rest[s + 'ForeArm'].d.clone(), n: V(0, 1, 0), local: B[s + 'Hand'].quaternion.clone() };   // palm faces down when the hand is aimed
    });
    const legLen = len.RightUpLeg + len.RightLeg;
    const s = legLen / 86, floorY = 195 + wp('RightFoot').y / s, hips0 = wp('Hips'), footPitch = Math.asin(-rest.RightFoot.d.y);
    const rootQ = B.Hips.parent.getWorldQuaternion(Q());

    const m1 = new T.Matrix4(), m2 = new T.Matrix4();
    function frameOf(d, n, out) {   // a full orientation from "points along d" and "hinge faces n"
      const y = d.clone().normalize(), x = n.clone().addScaledVector(y, -n.dot(y));

    }
    function worldQ(o, wq) {

    }

      const r = rest[name]; frameOf(r.d, r.n, m1); frameOf(d, n, m2); m2.multiply(m1.transpose());
      const q = Q().setFromRotationMatrix(m2).multiply(r.q);

    }
    /** Hinge axis for a two-bone limb: the bend itself when it is bent, sliding to a natural default when it is straight. */
    /**
     * Hinge axis for a two-bone limb: the bend itself when it is bent, sliding to a natural default when it is straight.
     * Knees only bend one way, so a "backwards" bend in the 2D drawing is ignored. The axis is also eased from frame to frame,
     * so a limb passing through straight never snaps round.
     */
    let prevN = {};
    function hinge(name, d1, d2, body, wq, leg, still) {

      const local = d1.clone().applyQuaternion(turn.clone().invert());

    }
    /**

    let P = null, plane = null, cur = null, mode = null;   // 2D point -> 3D point for the current move; the axis sticking out of the 2D drawing
    function pose(fig, j, still) {
      const D = (a, b) => P(b).sub(P(a)).normalize(), wq = new Map(), front = !!j.front, flat = mode === 'up' || mode === 'down' || mode === 'sit';
      const hip = j.hip, sh = front ? j.chest : j.sh, mid = front ? [(hip[0] + sh[0]) / 2, (hip[1] + sh[1]) / 2] : j.mid;
      let near = 'Right', far = 'Left', dHip = D(hip, mid), dChest = D(mid, sh), dNeck = D(sh, j.head), latHip, latChest;
      if (mode === 'sit') { dHip = dChest = dNeck = V(0, 1, 0); latHip = latChest = V(1, 0, 0); }
      else if (mode) {   // we know which way the chest faces, so the left-right axis follows from it

      } else { latChest = front ? D(j.near.shJ, j.far.shJ) : V(1, 0, 0); latHip = front ? D(j.near.hipJ, j.far.hipJ) : latChest; }

      rig.position.copy(P(hip)).sub(joints);

      const target = (rootBone, root2, end2, lift) => { const t = P(end2); return lift ? t.addScaledVector(plane, wp(rootBone).sub(P(root2)).dot(plane) * lift) : t; };

        aim(side + 'Foot', (flat ? D(l.knee, l.ank) : D(l.ank, l.toe)).applyAxisAngle(n, footPitch), n, wq);
        const m = hinge(side + 'Arm', D(sh2, l.el), D(l.el, l.hand), 'Spine2', wq, false, still);
        const hand = reach(side + 'Arm', side + 'ForeArm', target(side + 'Arm', sh2, l.hand, mode === 'sit' ? 0 : cur.grip ? 0.2 : 1), m, wq);   // both hands on one weight: bring them together
        // a hand resting on the floor lies flat, fingers pointing the way the head points; otherwise it simply follows the forearm
        const H = B[side + 'Hand'], flatDir = dChest.clone().setY(0);

        else H.quaternion.copy(rest[side + 'Hand'].local);

    }

    // --- equipment
    const mat = (c, o) => new T.MeshStandardMaterial(Object.assign({ color: c, roughness: 0.6 }, o));
    function dumbbell() {
      const g = new T.Group(), plate = new T.CylinderGeometry(0.05, 0.05, 0.05, 20), m = mat(LOOK.steel, { metalness: 0.4, roughness: 0.35 });
      g.add(new T.Mesh(new T.CylinderGeometry(0.014, 0.014, 0.2, 10), m));
      [-0.085, 0.085].forEach(y => { const p = new T.Mesh(plate, m); p.position.y = y; g.add(p); });
      g.traverse(o => { o.castShadow = true; }); return g;
    }
    function buildProps(fig) {
      props.clear(); const live = [];
      (fig.props || []).forEach(q => {
        if (q[0] === 'rect' || q[0] === 'line') {
          const r = q[0] === 'rect' ? [q[1], q[2], q[3], q[4]] : [Math.min(q[1], q[3]) - 2, Math.min(q[2], q[4]), Math.abs(q[3] - q[1]) + 4, Math.abs(q[4] - q[2]) + 4];
          const wall = q[0] === 'line', deep = wall ? 1.3 : 0.75, size = fig.front ? [r[2] * s, r[3] * s, deep] : [deep, r[3] * s, r[2] * s];
          const b = new T.Mesh(new T.BoxGeometry(size[0], size[1], size[2]), mat(LOOK.block, wall ? { transparent: true, opacity: 0.45 } : {}));
          b.position.copy(P([r[0] + r[2] / 2, r[1] + r[3] / 2])); b.castShadow = !wall; b.receiveShadow = true; props.add(b);
        }

        if (q[0] === 'band') { const b = new T.Mesh(new T.CylinderGeometry(0.012, 0.012, 1, 8), mat(LOOK.band)); props.add(b); live.push({ band: b, a: q[1], b: q[2] }); }
      });

    }
    const UP = V(0, 1, 0);
    function point(k, j) {
      if (Array.isArray(k)) return P(k);
      if (k === 'knee') return wp('RightLeg').add(V(0, 0.07, 0));
      if (k === 'foot') return wp('RightFoot');
      const side = k === 'hand2' ? 'Left' : 'Right', h = wp(side + 'Hand');
      return h.add(h.clone().sub(wp(side + 'ForeArm')).normalize().multiplyScalar(0.07));   // the palm, a little past the wrist
    }
    function moveProps(live) {
      live.forEach(o => {
        if (o.db) {
          const side = o.at === 'hand2' ? 'Left' : 'Right', fore = wp(side + 'Hand').sub(wp(side + 'ForeArm')).normalize();

    /** Tint the parts of the body surface that belong to the working bones. */
    function paint(hot) {
      const names = [].concat(...(hot || []).map(h => HOT[h] || [])), lime = new T.Color(LOOK.hot);
      meshes.forEach(m => {
        const idx = m.geometry.attributes.skinIndex, wt = m.geometry.attributes.skinWeight, col = m.geometry.attributes.color, base = m.userData.base;

    // --- camera: framed from the 2D view box, turned a little so the depth shows; drag sideways to look around
    let az = 0, tilt = rad(10), target = V(), dist = 4;

    }
    let drag = null;
